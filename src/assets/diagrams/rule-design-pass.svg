  <text x="46" y="33" class="diagram-region-label" fill="#085568" font-size="10" font-weight="600">DEV · peer_dev (both ways)</text>
  <text x="466" y="33" text-anchor="end" class="diagram-caption" fill="#3a5560" font-size="9">ICMP · TCP 80/53 · UDP 53</text>

  <use href="#rd-aws-ec2" x="78" y="68" width="40" height="40"/>
  <text x="98" y="128" text-anchor="middle" class="diagram-label" fill="#1a3844" font-size="10">Syd-dev</text>
  <text x="98" y="141" text-anchor="middle" class="diagram-mono" fill="#1a3844" font-size="9"
        font-family="Source Code Pro, ui-monospace, monospace">10.255.1.0/24</text>

  <g class="diagram-edge" stroke="#7a969e" stroke-width="1.5">
    <line x1="132" y1="88" x2="348" y2="88" marker-start="url(#rd-arrow)" marker-end="url(#rd-arrow)"/>
  </g>
  <text x="240" y="78" text-anchor="middle" class="diagram-allow-tag" fill="#067647" font-size="9" font-weight="600">PASS</text>

  <use href="#rd-aws-ec2" x="362" y="68" width="40" height="40"/>
  <text x="382" y="128" text-anchor="middle" class="diagram-label" fill="#1a3844" font-size="10">Akl-dev</text>
  <text x="382" y="141" text-anchor="middle" class="diagram-mono" fill="#1a3844" font-size="9"
        font-family="Source Code Pro, ui-monospace, monospace">10.254.1.0/24</text>

  <!-- PROD panel -->
  <rect x="500" y="14" width="468" height="168" rx="12" class="diagram-region" fill="#f7fbfc" stroke="#0b6f88"/>
  <use href="#rd-grp-region" x="514" y="22" width="14" height="14"/>
  <text x="534" y="33" class="diagram-region-label" fill="#085568" font-size="10" font-weight="600">PROD · svc_prod_http</text>
  <text x="954" y="33" text-anchor="end" class="diagram-caption" fill="#3a5560" font-size="9">TCP 80/443 · /32 apps</text>

  <use href="#rd-aws-ec2" x="566" y="68" width="40" height="40"/>
