  <text x="586" y="141" text-anchor="middle" class="diagram-mono" fill="#1a3844" font-size="9"
        font-family="Source Code Pro, ui-monospace, monospace">apps /32</text>

  <g class="diagram-edge" stroke="#7a969e" stroke-width="1.5">
    <line x1="620" y1="88" x2="836" y2="88" marker-start="url(#rd-arrow)" marker-end="url(#rd-arrow)"/>
  </g>
  <text x="728" y="78" text-anchor="middle" class="diagram-allow-tag" fill="#067647" font-size="9" font-weight="600">PASS</text>

  <use href="#rd-aws-ec2" x="850" y="68" width="40" height="40"/>
  <text x="870" y="128" text-anchor="middle" class="diagram-label" fill="#1a3844" font-size="10">Akl-prod</text>
  <text x="870" y="141" text-anchor="middle" class="diagram-mono" fill="#1a3844" font-size="9"
        font-family="Source Code Pro, ui-monospace, monospace">apps /32</text>

  <text x="12" y="208" class="diagram-caption" fill="#3a5560" font-size="9">same-Region: Syd-dev · Syd-prod · Akl-dev · Akl-prod via same_region_demo (ICMP · TCP 80)</text>
  <text x="12" y="224" class="diagram-caption" fill="#3a5560" font-size="9">No whole-CIDR open · dummy groups (SSH jumps, LDAP, NTP, batch) · still drop from real demo hosts</text>
</svg>
