<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 248" width="100%" role="img"
     aria-label="Lab PASS intent: peer_dev allows Syd-dev and Akl-dev both ways; svc_prod_http allows Syd-prod and Akl-prod HTTP; same_region_demo covers same-Region dev to prod; dummy IP sets still drop"
     font-family="Manrope, Open Sans, Segoe UI, sans-serif">
  <title>Rule design · which spokes PASS covers</title>
  <desc>Two panels. Left: DEV Syd-dev and Akl-dev with a bidirectional peer_dev path. Right: PROD Syd-prod and Akl-prod with bidirectional HTTP for svc_prod_http. Footnote notes same_region_demo for same-Region traffic and that dummy IP sets still drop from real hosts.</desc>

