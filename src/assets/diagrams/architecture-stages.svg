<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 210" width="100%" role="img"
     aria-label="Build order: hubs, dev workloads, prod workloads, hub peering, prove mesh, then Network Firewall deny, allow and validate, with the two hub flags changing across three phases"
     font-family="Manrope, Open Sans, Segoe UI, sans-serif">
  <title>Build order and the two staged Network Firewall flags</title>
  <desc>Eight stages left to right: hubs, dev workloads, prod workloads, hub peering, prove mesh, Network Firewall deny, Network Firewall allow, validate. Underneath, three phases show the hub flags. Mesh covers the first five stages with enable_network_firewall false and firewall_rules_enabled false. Deny covers the sixth stage with enable_network_firewall true and firewall_rules_enabled false. Allow covers the last two stages with both flags true.</desc>

<!--
  Icons are official AWS Architecture Icons, inlined as <symbol> from
  https://jajera.github.io/aws-icons/ (browse, copy, strip the Sketch id=""
  attributes so ids stay unique in the page).
  Colours come from the .diagram-* classes in src/styles/splash-overrides.css:
  presentation attributes here are the light palette, the CSS overrides dark.
-->
  <defs>
    <marker id="stage-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="diagram-edge-fill" fill="#7a969e"/>
    </marker>
  </defs>

  <text x="12" y="22" class="diagram-title" fill="#071014" font-size="12" font-weight="600">Build order</text>
  <text x="968" y="22" text-anchor="end" class="diagram-caption" fill="#3a5560" font-size="9">mesh first, firewall last</text>

  <!-- stage rail -->
  <g class="diagram-edge" stroke="#7a969e" stroke-width="1.5">
    <line x1="114" y1="87" x2="130" y2="87" marker-end="url(#stage-arrow)"/>
    <line x1="236" y1="87" x2="252" y2="87" marker-end="url(#stage-arrow)"/>
    <line x1="358" y1="87" x2="374" y2="87" marker-end="url(#stage-arrow)"/>
    <line x1="480" y1="87" x2="496" y2="87" marker-end="url(#stage-arrow)"/>
    <line x1="602" y1="87" x2="618" y2="87" marker-end="url(#stage-arrow)"/>
    <line x1="724" y1="87" x2="740" y2="87" marker-end="url(#stage-arrow)"/>
    <line x1="846" y1="87" x2="862" y2="87" marker-end="url(#stage-arrow)"/>
  </g>

  <g class="diagram-caption" fill="#3a5560" font-size="9" text-anchor="middle">
    <text x="63" y="50">1</text>
    <text x="185" y="50">2</text>
    <text x="307" y="50">3</text>
    <text x="429" y="50">4</text>
    <text x="551" y="50">5</text>
    <text x="673" y="50">6</text>
    <text x="795" y="50">7</text>
    <text x="917" y="50">8</text>
  </g>

  <rect x="12" y="60" width="102" height="54" rx="8" class="diagram-panel" fill="#ffffff" stroke="#c5d4d8"/>
  <text x="63" y="82" text-anchor="middle" class="diagram-label" fill="#1a3844" font-size="10" font-weight="600">Hubs</text>
  <text x="63" y="96" text-anchor="middle" class="diagram-caption" fill="#3a5560" font-size="9">TGW + insp VPC</text>

  <rect x="134" y="60" width="102" height="54" rx="8" class="diagram-panel" fill="#ffffff" stroke="#c5d4d8"/>
  <text x="185" y="82" text-anchor="middle" class="diagram-label" fill="#1a3844" font-size="10" font-weight="600">Workloads dev</text>
  <text x="185" y="96" text-anchor="middle" class="diagram-caption" fill="#3a5560" font-size="9">spoke + host</text>

  <rect x="256" y="60" width="102" height="54" rx="8" class="diagram-panel" fill="#ffffff" stroke="#c5d4d8"/>
  <text x="307" y="82" text-anchor="middle" class="diagram-label" fill="#1a3844" font-size="10" font-weight="600">Workloads prod</text>
  <text x="307" y="96" text-anchor="middle" class="diagram-caption" fill="#3a5560" font-size="9">spoke + host</text>

  <rect x="378" y="60" width="102" height="54" rx="8" class="diagram-panel" fill="#ffffff" stroke="#c5d4d8"/>
  <text x="429" y="82" text-anchor="middle" class="diagram-label" fill="#1a3844" font-size="10" font-weight="600">Hub peering</text>
  <text x="429" y="96" text-anchor="middle" class="diagram-caption" fill="#3a5560" font-size="9">re-apply after prod</text>

  <rect x="500" y="60" width="102" height="54" rx="8" class="diagram-panel" fill="#ffffff" stroke="#c5d4d8"/>
  <text x="551" y="82" text-anchor="middle" class="diagram-label" fill="#1a3844" font-size="10" font-weight="600">Prove mesh</text>
  <text x="551" y="96" text-anchor="middle" class="diagram-caption" fill="#3a5560" font-size="9">ping · curl · dig</text>

  <rect x="622" y="60" width="102" height="54" rx="8" class="diagram-panel" fill="#ffffff" stroke="#c5d4d8"/>
  <rect x="622" y="60" width="102" height="54" rx="8" fill="none" class="diagram-edge-deny" stroke="#b42318"/>
  <text x="673" y="82" text-anchor="middle" class="diagram-deny-tag" fill="#b42318" font-size="10" font-weight="600">NFW deny</text>
  <text x="673" y="96" text-anchor="middle" class="diagram-caption" fill="#3a5560" font-size="9">default drop</text>

  <rect x="744" y="60" width="102" height="54" rx="8" class="diagram-panel" fill="#ffffff" stroke="#c5d4d8"/>
  <rect x="744" y="60" width="102" height="54" rx="8" fill="none" class="diagram-edge-allow" stroke="#067647"/>
  <text x="795" y="82" text-anchor="middle" class="diagram-allow-tag" fill="#067647" font-size="10" font-weight="600">NFW allow</text>
  <text x="795" y="96" text-anchor="middle" class="diagram-caption" fill="#3a5560" font-size="9">PASS rule groups</text>

  <rect x="866" y="60" width="102" height="54" rx="8" class="diagram-panel" fill="#ffffff" stroke="#c5d4d8"/>
  <text x="917" y="82" text-anchor="middle" class="diagram-label" fill="#1a3844" font-size="10" font-weight="600">Validate</text>
  <text x="917" y="96" text-anchor="middle" class="diagram-caption" fill="#3a5560" font-size="9">alert + flow logs</text>

  <!-- phase brackets -->
  <g class="diagram-edge-dashed" stroke="#c5d4d8" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="307" y1="114" x2="307" y2="136"/>
    <line x1="673" y1="114" x2="673" y2="136"/>
    <line x1="855" y1="114" x2="855" y2="136"/>
  </g>

  <rect x="12" y="136" width="590" height="58" rx="8" class="diagram-panel" fill="#ffffff" stroke="#c5d4d8"/>
  <text x="307" y="155" text-anchor="middle" class="diagram-label" fill="#1a3844" font-size="10" font-weight="600">Mesh — TGW only</text>
  <text x="307" y="171" text-anchor="middle" class="diagram-mono" fill="#1a3844" font-size="9"
        font-family="Source Code Pro, ui-monospace, monospace">enable_network_firewall = false</text>
  <text x="307" y="185" text-anchor="middle" class="diagram-mono" fill="#1a3844" font-size="9"
        font-family="Source Code Pro, ui-monospace, monospace">firewall_rules_enabled = false</text>

  <rect x="622" y="136" width="102" height="58" rx="8" class="diagram-panel" fill="#ffffff" stroke="#c5d4d8"/>
  <rect x="622" y="136" width="102" height="58" rx="8" fill="none" class="diagram-edge-deny" stroke="#b42318"/>
  <text x="673" y="155" text-anchor="middle" class="diagram-deny-tag" fill="#b42318" font-size="10" font-weight="600">Deny</text>
  <text x="673" y="171" text-anchor="middle" class="diagram-mono" fill="#1a3844" font-size="9"
        font-family="Source Code Pro, ui-monospace, monospace">nfw = true</text>
  <text x="673" y="185" text-anchor="middle" class="diagram-mono" fill="#1a3844" font-size="9"
        font-family="Source Code Pro, ui-monospace, monospace">rules = false</text>

  <rect x="744" y="136" width="224" height="58" rx="8" class="diagram-panel" fill="#ffffff" stroke="#c5d4d8"/>
  <rect x="744" y="136" width="224" height="58" rx="8" fill="none" class="diagram-edge-allow" stroke="#067647"/>
  <text x="856" y="155" text-anchor="middle" class="diagram-allow-tag" fill="#067647" font-size="10" font-weight="600">Allow</text>
  <text x="856" y="171" text-anchor="middle" class="diagram-mono" fill="#1a3844" font-size="9"
        font-family="Source Code Pro, ui-monospace, monospace">nfw = true</text>
  <text x="856" y="185" text-anchor="middle" class="diagram-mono" fill="#1a3844" font-size="9"
        font-family="Source Code Pro, ui-monospace, monospace">rules = true</text>
</svg>
