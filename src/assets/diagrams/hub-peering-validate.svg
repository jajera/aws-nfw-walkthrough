<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 334" width="100%" role="img"
     aria-label="Joint hub-peering gate: one attachment available in both Regions, peer still on no_inspection both sides, four A records matching live hosts, and peering CIDR lists matching the hub outputs"
     font-family="Manrope, Open Sans, Segoe UI, sans-serif">
  <title>The four things the hub-peering gate asserts</title>
  <desc>A rail across the top shows the order: Sydney checks, Auckland checks, this peering gate, then Prove mesh. Below are four assertions. First, a single peering attachment id reports available in both ap-southeast-2 and ap-southeast-6. Second, the peer association on both sides is still the no_inspection route table, because Network Firewall is not attached yet. Third, all four A records in lab.demo match the live host IPs, which requires enable_prod_workloads true. Fourth, the peering stack's spoke CIDR lists equal the local_spoke_cidrs output from each hub.</desc>

