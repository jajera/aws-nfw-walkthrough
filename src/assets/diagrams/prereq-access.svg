  <!-- column headers -->
  <text x="12" y="32" class="diagram-label" fill="#1a3844" font-size="10" font-weight="600">AWS CLI profile</text>
  <text x="270" y="32" class="diagram-label" fill="#1a3844" font-size="10" font-weight="600">Account</text>

  <!-- ══ Region columns ═══════════════════════════════════════════════════ -->
