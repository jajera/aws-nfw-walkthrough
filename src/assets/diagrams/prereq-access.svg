<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="100%" role="img"
     aria-label="Three AWS CLI profiles map to three accounts, and each account applies stacks in both ap-southeast-2 and ap-southeast-6"
     font-family="Manrope, Open Sans, Segoe UI, sans-serif">
  <title>Which profile drives which stacks, in which Region</title>
  <desc>Three rows. Each row starts with an AWS CLI profile placeholder, points at the account it authenticates to, then shows the stacks that account applies in ap-southeast-2 Sydney and in ap-southeast-6 Auckland. The hub profile drives the hub stack in both Regions plus the hub-peering stack, which exists only in ap-southeast-2. The dev profile drives workload-dev in both Regions and the prod profile drives workload-prod in both Regions. Every profile has to reach both Regions, and ap-southeast-6 may need Region opt-in.</desc>

<!--
  Icons are official AWS Architecture Icons, inlined as <symbol> from
  https://jajera.github.io/aws-icons/ (browse, copy, strip the Sketch id=""
  attributes so ids stay unique in the page).
  Colours come from the .diagram-* classes in src/styles/splash-overrides.css:
  presentation attributes here are the light palette, the CSS overrides dark.
-->
  <defs>
    <marker id="acc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="diagram-edge-fill" fill="#7a969e"/>
    </marker>
    <symbol id="acc-aws-cli" viewBox="0 0 80 80">
      <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
      <g fill="#C925D1">
