  <text x="284" y="110" class="diagram-caption" fill="#3a5560" font-size="9">RAM-shares TGW out</text>

  <line x1="474" y1="88" x2="490" y2="88" class="diagram-edge" stroke="#7a969e" stroke-width="1.5" marker-end="url(#acc-arrow)"/>

