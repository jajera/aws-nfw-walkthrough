  <use href="#acc-grp-region" x="506" y="20" width="14" height="14"/>
  <text x="526" y="31" class="diagram-region-label" fill="#085568" font-size="10" font-weight="600">ap-southeast-2</text>

  <rect x="744" y="14" width="224" height="318" rx="12" class="diagram-region" fill="#f7fbfc" stroke="#0b6f88"/>
