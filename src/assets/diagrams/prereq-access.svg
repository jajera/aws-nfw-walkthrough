  <text x="520" y="272" class="diagram-mono" fill="#1a3844" font-size="9"
        font-family="Source Code Pro, ui-monospace, monospace">workload-prod</text>
  <text x="520" y="292" class="diagram-caption" fill="#3a5560" font-size="9">10.255.2.0/24</text>

  <rect x="756" y="248" width="200" height="80" rx="10" class="diagram-panel" fill="#ffffff" stroke="#c5d4d8"/>
  <text x="770" y="272" class="diagram-mono" fill="#1a3844" font-size="9"
        font-family="Source Code Pro, ui-monospace, monospace">workload-prod</text>
  <text x="770" y="292" class="diagram-caption" fill="#3a5560" font-size="9">10.254.2.0/24</text>

  <!-- ══ prerequisites that bite ══════════════════════════════════════════ -->
  <use href="#acc-aws-org" x="12" y="344" width="14" height="14"/>
  <text x="32" y="355" class="diagram-caption" fill="#3a5560" font-size="9">Same Organization: enable RAM resource sharing, or the hub → workload TGW shares fail.</text>
  <text x="32" y="370" class="diagram-caption" fill="#3a5560" font-size="9">Every profile must reach both Regions — ap-southeast-6 may need Region opt-in first.</text>
