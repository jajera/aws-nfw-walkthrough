<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 208" width="100%" role="img"
     aria-label="Same-Region dev to prod: the spoke hairpins through the local Transit Gateway inspection route table to one Network Firewall, then back out via no_inspection to the destination spoke, with both directions handled by that same firewall"
     font-family="Manrope, Open Sans, Segoe UI, sans-serif">
  <title>Same Region — one local firewall sees both directions</title>
  <desc>Inside ap-southeast-2, the dev spoke sends to the Transit Gateway, whose spoke association is the inspection route table, so traffic hairpins to the Sydney Network Firewall. After inspection the no_inspection route table forwards to the prod spoke. Every arrow is bidirectional because the reverse direction takes the identical path, so one firewall evaluates both halves of the session and keeps full state. The dev and prod spokes live in different accounts.</desc>

